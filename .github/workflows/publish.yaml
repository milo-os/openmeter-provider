name: Publish Docker Image

on:
  push:
  release:
    types: ['published']

jobs:
  publish-container-image:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.21.0
    with:
      image-name: openmeter-provider
      registry-organization: milo-os
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-ui-image:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.21.0
    with:
      image-name: openmeter-provider-ui
      registry-organization: milo-os
      platforms: linux/amd64,linux/arm64
      dockerfile-path: ui/Dockerfile
      context: ui
    secrets: inherit

  # The bundle pins the image tag built by publish-container-image, and Flux
  # deploys it as soon as it lands, so it must not be pushed before the image.
  publish-kustomize-bundles:
    needs: publish-container-image
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.21.0
    with:
      bundle-name: ghcr.io/milo-os/openmeter-provider-kustomize
      bundle-path: config
      image-overlays: config/base/manager,config/base/submission-consumer,config/base/usage-apiserver
      image-name: ghcr.io/milo-os/openmeter-provider
    secrets: inherit
