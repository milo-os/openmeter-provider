namespace: openmeter-system

images:
  - name: ghcr.io/milo-os/openmeter-provider
    newTag: dev

resources:
  - ../../base/manager
  - ../../base/submission-consumer

components:
  - ../../components/namespace
  - ../../components/controller_rbac
  - ../../components/leader_election
  # The usage API server, registered in this cluster: in dev the kind
  # cluster plays Milo's part (it holds the billing CRDs and Projects, and
  # proxies UsageQuery to the server).
  - ../../components/usage-apiserver
  - ../../components/usage-api-registration

configMapGenerator:
  - name: openmeter-provider-config
    behavior: replace
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true

patches:
  - path: dev_patch.yaml
  - target:
      kind: Deployment
      name: submission-consumer
    path: submission_consumer_patch.yaml
  - path: usage_apiserver_patch.yaml
