namespace: openmeter-provider-system

images:
  - name: ghcr.io/milo-os/openmeter-provider
    newTag: dev

resources:
  - ../../base/manager

components:
  - ../../components/namespace
  - ../../components/controller_rbac

configMapGenerator:
  - name: openmeter-provider-config
    behavior: replace
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true

patches:
  - path: dev_patch.yaml
