apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openmeter
  namespace: openmeter-system
spec:
  interval: 5m
  # The OpenMeter chart bundles Kafka, ClickHouse, Redis, PostgreSQL, Svix and
  # six app workloads. A full install/upgrade on a dev kind node routinely
  # exceeds the helm default, so give the upgrade action generous headroom.
  timeout: 15m

  chart:
    spec:
      chart: openmeter
      version: "1.0.0-beta.232"
      sourceRef:
        kind: HelmRepository
        name: openmeter
        namespace: openmeter-system
      interval: 1h

  # Values for the chart
  # https://github.com/openmeterio/openmeter/blob/main/deploy/charts/openmeter/values.yaml
  #
  # Bundled dependencies are listed explicitly (enabled: true) so it's clear
  # what OpenMeter stands up alongside it. Kafka, ClickHouse, Redis, PostgreSQL
  # and Svix all default to enabled in the chart, so these lines are equivalent
  # to the defaults — they're here for documentation, not to change behavior.
  # For production, set the ones you don't use to `enabled: false` and point
  # `config` at external brokers/stores instead.
  values:
    # OpenMeter talks to Kafka, ClickHouse, Redis, PostgreSQL and Svix over the
    # network but never calls the Kubernetes API, so it doesn't need its own
    # ServiceAccount or a projected service-account token. Setting create:false
    # makes the pods run as the namespace `default` SA, and automount:false stops
    # any SA token being mounted — a small least-privilege hardening.
    serviceAccount:
      create: false
      automount: false

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Event streaming backlog / ingestion queue used by OpenMeter.
    kafka:
      enabled: true
    # Long-term storage + analytics for metering events.
    clickhouse:
      enabled: true
    # Caching / short-lived state (RateLimiter, dedupe, etc.). Also backs the
    # sink-worker's cross-flush event deduplication configured below.
    redis:
      enabled: true

    # OpenMeter application config (rendered into the chart's config.yaml and
    # deep-merged with the Kafka/ClickHouse/Postgres/Svix wiring the chart
    # generates for the bundled dependencies).
    config:
      # Rate cards convert metered usage into their pricing unit before
      # pricing (ServicePricing spec.unitConversion -> unit_config), e.g.
      # bytes priced per GiB. Off by default; with it off OpenMeter refuses
      # to bill those lines rather than billing raw units.
      unitConfig:
        enabled: true
      credits:
        enabled: true
        enableCreditThenInvoice: true
      sink:
        # Cross-flush event deduplication. OpenMeter's default
        # (sink.dedupe.enabled: false, app/config/sink.go) only drops
        # duplicates that land in the SAME sink flush (~2s / 500 messages),
        # so a JetStream redelivery or an operator replay of an already
        # ingested usage event would be billed twice. With this enabled the
        # sink-worker checks every event's (namespace, source, id) against
        # redis BEFORE writing it to ClickHouse and records it only AFTER the
        # write succeeded, so a failed write is retried, never lost.
        #
        # Deliberately only `sink.dedupe`, NOT the top-level `dedupe` (ingest
        # API) deduplicator: that one marks an event as seen before it is
        # durably queued (openmeter/ingest DeduplicatingCollector), so a
        # retried submission after a failed Kafka write would be silently
        # dropped; and pointed at the same redis database it would pre-mark
        # every event, making this sink dedupe discard ALL usage. OpenMeter's
        # own quickstart (quickstart/config.yaml) enables sink dedupe only.
        dedupe:
          enabled: true
          driver: redis
          config:
            # The chart's bundled Bitnami Redis (nameOverride: redis), the
            # same master service the chart wires Svix to.
            address: openmeter-redis-master:6379
            database: 0
            # Must outlive billing's replay window: the pipeline accepts and
            # replays events up to 30 days old (billing
            # docs/enhancements/usage-pipeline.md), and JetStream retention
            # is at least that long. 768h (32d) is OpenMeter's own
            # recommended value (config.example.yaml).
            expiration: 768h
    # Primary metadata/store database for OpenMeter and its sub-processes.
    postgresql:
      enabled: true
      # The OpenMeter chart hardcodes the bundled-Postgres connection URL without
      # an sslmode, so the client defaults to sslmode=prefer and attempts TLS.
      # Dev-only: for production, point `config.postgres.url` at a managed DB.
      tls:
        enabled: true
        autoGenerated: true
    # Webhook delivery service (outbound events/invoices).
    svix:
      enabled: true
      # GitOps note: Svix signs webhooks with this secret. See
      # https://openmeter.io/docs/reference/webhooks for rotating it.
      # Dev-only: In production and staging this MUST be a real
      # secret (e.g. a secretGenerator or external-secrets) — never committed.
      signingSecret: "dev-only-default"
      # The JWT OpenMeter presents to authenticate to Svix. Svix verifies this
      # against the signingSecret above, so the two MUST stay in lockstep: this
      # token is signed with "dev-only-default". If you change signingSecret,
      # regenerate signedJwt to match (or it fails with "Invalid token").
      # Dev-only — generate a fresh token per environment.
      signedJwt: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdml4LXNlcnZlciIsImlhdCI6MTczMDk4NzU0MywiZXhwIjoyMjM1OTA5MDAwLCJhdWQiOiIiLCJzdWIiOiJvcmdfMjNyYjhZZEdxTVQwcUl6cGdHd2RYZkhpck11In0.PtlaVtYzM0off03_R1muzi0LSYZr3D54xbWdsVJyMB0"
