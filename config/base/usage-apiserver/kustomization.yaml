apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The usage API server. Included through components/usage-apiserver, so a
# deployment opts in once Milo is ready to proxy to it.

resources:
- deployment.yaml
- service.yaml
- service_account.yaml
- pdb.yaml
- rbac.yaml

images:
- name: ghcr.io/milo-os/openmeter-provider
  newTag: latest
