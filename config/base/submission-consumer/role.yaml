# The submission consumer attributes each usage event to the BillingAccount
# billing stamped on it (the billingaccountref extension) and rewrites the
# event's subject to that account's UID, the OpenMeter customer key. It reads
# BillingAccounts, and BillingAccountBindings to tell apart same-named
# accounts in different namespaces (see internal/submission/attribution.go).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openmeter-provider-submission-consumer
rules:
- apiGroups:
  - billing.miloapis.com
  resources:
  - billingaccounts
  - billingaccountbindings
  verbs:
  - get
  - list
  - watch
