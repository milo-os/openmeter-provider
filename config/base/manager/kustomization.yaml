apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- manager.yaml
- service_account.yaml
- pdb.yaml

images:
- name: ghcr.io/milo-os/openmeter-provider
  newTag: latest

configMapGenerator:
- files:
  - config.yaml
  name: openmeter-provider-config
  options:
    disableNameSuffixHash: true
