apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: offer-delete-convergence
spec:
  description: |
    End-to-end exercise of the finalizer release path. A GA Offer (published
    through billing's flow, simulated by ../publish.sh) is synced
    and renamed (so its plan has an archived v1 and an active v2), then
    deleted. Every version must be deleted — the active one archived first,
    since OpenMeter refuses to delete an active plan — the Offer's features
    must be archived, and the Offer must disappear. Finally the
    MeterDefinition is deleted, which only succeeds once no active feature
    remains on its meter.
  namespace: openmeter-system
  steps:
    - name: start the OpenMeter query pod
      try:
        - apply:
            file: query-pod.yaml
        - assert:
            timeout: 20s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: openmeter-query-del
              status:
                phase: Running

    - name: GA Offer converges and is re-versioned
      try:
        - apply:
            file: meter.yaml
        - assert:
            timeout: 20s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MeterDefinition
              metadata:
                name: del-metric
                (finalizers[?@ == 'openmeter.miloapis.com/meter']): ['openmeter.miloapis.com/meter']
        - apply:
            file: servicepricings.yaml
        - apply:
            file: offer.yaml
        - script:
            timeout: 15s
            content: bash ../publish.sh e2e-offer-delete
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: Offer
              metadata:
                name: e2e-offer-delete
                (finalizers[?@ == 'openmeter.miloapis.com/product-plan']): ['openmeter.miloapis.com/product-plan']
              status:
                (conditions[?type == 'OpenMeterPlanSynced']):
                  - status: "True"
        - script:
            timeout: 60s
            content: |
              OFFER_UID=$(kubectl get offer e2e-offer-delete -o jsonpath='{.metadata.uid}')
              kubectl annotate offer e2e-offer-delete kubernetes.io/display-name="E2E Delete Offer v2" --overwrite
              bash verify.sh "$OFFER_UID" present

    - name: Delete converges — plan versions removed, features archived, finalizer released
      try:
        - script:
            timeout: 90s
            content: |
              OFFER_UID=$(kubectl get offer e2e-offer-delete -o jsonpath='{.metadata.uid}')
              kubectl delete offer e2e-offer-delete --wait=false
              bash verify.sh "$OFFER_UID" absent

    - name: MeterDefinition deletes once its features are archived
      try:
        - delete:
            ref:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MeterDefinition
              name: del-metric
        - error:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: MeterDefinition
              metadata:
                name: del-metric
