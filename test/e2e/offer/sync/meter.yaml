apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: e2e-metric
spec:
  meterName: e2e-metric
  phase: Published
  displayName: "E2E Metric"
  measurement:
    aggregation: Sum
    unit: count
    dimensions:
      - region
  billing:
    consumedUnit: count
    pricingUnit: count
  monitoredResourceTypes:
    - e2e.miloapis.com/Resource
