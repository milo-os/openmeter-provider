apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: invalid-metric
spec:
  meterName: invalid-metric
  phase: Published
  displayName: "Invalid Pricing E2E Metric"
  measurement:
    aggregation: Sum
    unit: count
    dimensions:
      - region
      - tier
  billing:
    consumedUnit: count
    pricingUnit: count
  monitoredResourceTypes:
    - e2e.miloapis.com/Resource
