# Status patch simulating what billing's own BillingAccountBinding
# controller would do (not present in this e2e cluster, which runs only
# openmeter-provider + OpenMeter itself). The binding no longer changes the
# OpenMeter customer (usage is attributed by account, not by project subject
# keys); it is here so the setup matches a real org, where a project's usage
# is only attributed to an account it is bound to.
apiVersion: billing.miloapis.com/v1alpha1
kind: BillingAccountBinding
metadata:
  name: e2e-submission-binding
status:
  phase: Active
