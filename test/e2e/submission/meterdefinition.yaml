apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: e2e-submission-requests
spec:
  # openmeter.MeterSlug lowercases the meterName and collapses every run of
  # non-alphanumerics into one '_', so this becomes the slug
  # e2e_miloapis_com_submission_requests the steps below query.
  meterName: e2e.miloapis.com/submission/requests
  phase: Published
  displayName: Submission Consumer E2E Requests
  measurement:
    aggregation: Sum
    unit: "{request}"
  billing:
    consumedUnit: "{request}"
    pricingUnit: "{request}"
  monitoredResourceTypes:
    - ri2.miloapis.com/hosted-api
