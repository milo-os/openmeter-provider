apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: invoicerequest
spec:
  description: |
    A bare metal contract end to end against a real OpenMeter instance:

      - a BillingEntitlement with a contract starting today subscribes the
        account straight away, billing on today's day of the month rather
        than the 1st;
      - a Preview InvoiceRequest prices the setup fee and the first month
        (OpenMeter's invoice simulation) and creates no invoice;
      - an Issue InvoiceRequest invoices exactly those charges now, matching
        the preview, and names the Invoice it becomes;
      - a second Issue finds nothing left to invoice.

    Billing's operator, webhooks and stripe-provider do not run in e2e: the
    Offer is published with ../offer/publish.sh and the payment method chain
    is fabricated with status patches, as in the billingentitlement suite.
    The issued invoice stays open, so the account is released with the
    force-delete annotation at the end.
  namespace: openmeter-system
  steps:
    - name: start the OpenMeter query pod
      try:
        - apply:
            file: query-pod.yaml
        - assert:
            timeout: 20s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: openmeter-query-ir
              status:
                phase: Running

    - name: publish the contract Offer
      try:
        - apply:
            file: offer.yaml
        - script:
            timeout: 30s
            content: bash ../offer/publish.sh e2e-ir-offer
        - assert:
            timeout: 60s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: Offer
              metadata:
                name: e2e-ir-offer
              status:
                (conditions[?type == 'OpenMeterPlanSynced']):
                  - status: "True"

    - name: create a billable account
      try:
        - apply:
            file: billingaccount.yaml
        - assert:
            timeout: 30s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              metadata:
                name: e2e-ir-account
                (finalizers[?@ == 'openmeter.miloapis.com/customer-link']): ['openmeter.miloapis.com/customer-link']
        - script:
            content: QUERY_POD=openmeter-query-ir sh ../billingaccount/resolve-stripe-customer.sh "$NAMESPACE" customerId
            outputs:
              - name: stripeCustomerId
                value: ($stdout)
        - script:
            content: QUERY_POD=openmeter-query-ir sh ../billingaccount/resolve-stripe-customer.sh "$NAMESPACE" paymentMethodId
            outputs:
              - name: stripePaymentMethodId
                value: ($stdout)
        - apply:
            file: paymentmethod.yaml
        - patch:
            file: paymentmethod-active.yaml
            subresource: status
        - patch:
            file: stripepaymentmethod-active.yaml
            subresource: status
        - apply:
            file: billingaccount-with-payment-method.yaml
        - patch:
            file: billingaccount-payment-method-ready.yaml
            subresource: status

    - name: a contract starting today subscribes now, billing on its day
      try:
        - script:
            timeout: 10s
            content: bash entitlement.sh
        - assert:
            # The entitlement retries a refused subscription every 30s.
            timeout: 100s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingEntitlement
              metadata:
                name: e2e-ir-entitlement
              status:
                (conditions[?type == 'OpenMeterSubscriptionSynced']):
                  - status: "True"
        - script:
            timeout: 70s
            content: bash expect-subscription.sh
        - script:
            timeout: 100s
            content: bash wait-charges.sh

    - name: a Preview prices the charges without invoicing
      try:
        - script:
            timeout: 150s
            content: bash preview.sh

    - name: an Issue invoices exactly the previewed charges
      try:
        - script:
            timeout: 150s
            content: bash issue.sh
      catch:
        # The invoice may be open, which keeps the account from deleting.
        - script:
            content: bash release-account.sh

    - name: a second Issue finds nothing to invoice
      try:
        - script:
            timeout: 150s
            content: bash reissue.sh
      catch:
        # The invoice may be open, which keeps the account from deleting.
        - script:
            content: bash release-account.sh

    - name: clean up
      try:
        - script:
            timeout: 10s
            content: kubectl delete billingentitlement e2e-ir-entitlement -n "$NAMESPACE" --wait=false
        - error:
            timeout: 60s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingEntitlement
              metadata:
                name: e2e-ir-entitlement
        - script:
            timeout: 10s
            content: bash release-account.sh
        - script:
            timeout: 10s
            content: kubectl delete billingaccount e2e-ir-account -n "$NAMESPACE" --wait=false
        - error:
            timeout: 120s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              metadata:
                name: e2e-ir-account
      catch:
        - script:
            content: bash release-account.sh
