# Pay as you go: the account's Offer before it moves onto a contract.
# Usage only, so its subscription bills in arrears and creates no invoice of
# its own; OpenMeter still requires the customer to be invoiceable.
apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: ir-usage-metric
spec:
  meterName: ir-usage-metric
  phase: Published
  displayName: "Invoice Request E2E Metric"
  measurement:
    aggregation: Sum
    unit: count
  billing:
    consumedUnit: count
    pricingUnit: count
  monitoredResourceTypes:
    - e2e.miloapis.com/Resource
---
apiVersion: billing.miloapis.com/v1alpha1
kind: ServicePricing
metadata:
  name: ir-usage
spec:
  displayName: "Invoice Request Usage"
  chargeType: Usage
  currency: USD
  metric: ir-usage-metric
  pricingUnit: count
  serviceRef: compute.miloapis.com
  rates:
    - flat: "0.01"
---
apiVersion: billing.miloapis.com/v1alpha1
kind: Offer
metadata:
  name: e2e-ir-payg
  annotations:
    kubernetes.io/display-name: "E2E Pay As You Go"
spec:
  launchStage: Draft
  chargeTypes:
    - Usage
  servicePricingRefs:
    - name: ir-usage
      namespace: openmeter-system
