apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: e2e-agg-count
spec:
  meterName: e2e.miloapis.com/agg/count
  phase: Published
  displayName: E2E Count Aggregation
  measurement:
    aggregation: Count
    unit: "{request}"
    dimensions:
      - region
  billing:
    consumedUnit: "{request}"
    pricingUnit: "{request}"
  monitoredResourceTypes:
    - ri2.miloapis.com/hosted-api
