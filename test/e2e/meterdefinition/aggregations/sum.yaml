apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: e2e-agg-sum
spec:
  # openmeter.MeterSlug lowercases the meterName and collapses every run of
  # non-alphanumerics into one '_': slug e2e_miloapis_com_agg_sum.
  meterName: e2e.miloapis.com/agg/sum
  phase: Published
  displayName: E2E Sum Aggregation
  measurement:
    aggregation: Sum
    unit: "By"
    dimensions:
      - region
  billing:
    consumedUnit: "By"
    pricingUnit: "By"
  monitoredResourceTypes:
    - ri2.miloapis.com/hosted-api
