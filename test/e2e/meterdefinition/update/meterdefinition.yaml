apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: e2e-update-requests
spec:
  # openmeter.MeterSlug lowercases the meterName and collapses every run of
  # non-alphanumerics into one '_': slug e2e_miloapis_com_update_requests.
  meterName: e2e.miloapis.com/update/requests
  phase: Published
  # No spec.description: the controller falls back to displayName.
  displayName: Initial Display Name
  measurement:
    aggregation: Sum
    unit: "{request}"
    dimensions:
      - region
  billing:
    consumedUnit: "{request}"
    pricingUnit: "{request}"
  monitoredResourceTypes:
    - ri2.miloapis.com/hosted-api
