# Long-lived helper pod used to reach the openmeter-api ClusterIP service
# from inside the cluster network via `kubectl exec`. The app pods
# themselves are distroless and offer no shell/curl.
apiVersion: v1
kind: Pod
metadata:
  name: openmeter-query
spec:
  restartPolicy: Never
  containers:
    - name: query
      image: busybox:1.36
      command: ["sleep", "3600"]
