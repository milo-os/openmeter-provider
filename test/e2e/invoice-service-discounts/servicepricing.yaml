# One usage price per meter.
# Lines:
#   inv-sd-compute: 25 x $0.04 = $1.00 (with 15% discount -> $0.85)
#   inv-sd-storage: 50 x $0.02 = $1.00 (with 100% discount -> $0.00)
#   inv-sd-egress: 10 x $0.09 = $0.90 (0% discount)
#   inv-sd-memory: 50 GiB-s x $0.01 = $0.50 (0% discount)
#   inv-sd-egress-tiered: 8 GiB in tiers = $0.45 (0% discount)
# Total invoice = $2.70.
apiVersion: billing.miloapis.com/v1alpha1
kind: ServicePricing
metadata:
  name: inv-sd-compute
spec:
  displayName: "Compute: vCPU hours"
  chargeType: Usage
  currency: USD
  metric: inv-sd-vcpu-hours
  pricingUnit: "{vCPU-hour}"
  serviceRef: compute.miloapis.com
  rates:
    - flat: "0.04"
---
apiVersion: billing.miloapis.com/v1alpha1
kind: ServicePricing
metadata:
  name: inv-sd-storage
spec:
  displayName: "Block storage: GB-months"
  chargeType: Usage
  currency: USD
  metric: inv-sd-storage-gb-months
  pricingUnit: "{GB-month}"
  serviceRef: storage.miloapis.com
  rates:
    - flat: "0.02"
---
apiVersion: billing.miloapis.com/v1alpha1
kind: ServicePricing
metadata:
  name: inv-sd-egress
spec:
  displayName: "Network egress: GB"
  chargeType: Usage
  currency: USD
  metric: inv-sd-egress-gb
  pricingUnit: GBy
  serviceRef: networking.miloapis.com
  rates:
    - flat: "0.09"
---
apiVersion: billing.miloapis.com/v1alpha1
kind: ServicePricing
metadata:
  name: inv-sd-memory
spec:
  displayName: "Compute: memory GiB-seconds"
  chargeType: Usage
  currency: USD
  metric: inv-sd-memory-byte-seconds
  pricingUnit: GiB-second
  serviceRef: compute.miloapis.com
  rates:
    - flat: "0.01"
  unitConversion:
    meterUnitsPerPricingUnit: "1073741824"
    description: "1 GiB = 1,073,741,824 bytes"
---
apiVersion: billing.miloapis.com/v1alpha1
kind: ServicePricing
metadata:
  name: inv-sd-egress-tiered
spec:
  displayName: "Network egress: GiB, tiered"
  chargeType: Usage
  currency: USD
  metric: inv-sd-egress-bytes
  pricingUnit: GiB
  serviceRef: networking.miloapis.com
  rates:
    - tiered:
        - upTo: "2"
          rate: "0"
        - upTo: "5"
          rate: "0.10"
        - rate: "0.05"
  unitConversion:
    meterUnitsPerPricingUnit: "1073741824"
    description: "1 GiB = 1,073,741,824 bytes"
