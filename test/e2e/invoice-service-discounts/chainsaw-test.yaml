apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: invoice-service-discounts
spec:
  description: |
    Tests invoice creation and verification with per-service discounts:
    - ServicePricing inv-sd-compute has a 15% discount (list price $1.00 -> net $0.85).
    - ServicePricing inv-sd-storage has a 100% discount (list price $1.00 -> net $0.00).
    - Other services (egress $0.90, memory $0.50, tiered egress $0.45) have 0% discount.
    - Invoice total is $2.70 ($0.85 + $0.00 + $0.90 + $0.50 + $0.45).

    Verifies that the 100% discount service gets 0 pricing at the end ($0.00)
    and that the 15% discount service works correctly ($0.85 net).
  namespace: openmeter-system
  steps:
    - name: purge stale usage events for the suite's project
      try:
        - script:
            timeout: 45s
            content: |
              set -eu
              NATS_POD=$(kubectl get pod -n nats-system -l app.kubernetes.io/component=nats-box --no-headers -o name | head -1)
              if [ -z "$NATS_POD" ]; then
                echo "WARNING: no nats-box pod found, skipping purge"
                exit 0
              fi
              kubectl exec -n nats-system "$NATS_POD" -- \
                nats --server nats://nats:4222 \
                stream purge billing-usage \
                --subject "billing.usage.e2e-invoice-sd.>" -f || true

    - name: start the OpenMeter query pod and check Stripe is set up
      try:
        - apply:
            file: query-pod.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: openmeter-query-inv-sd
              status:
                phase: Running
        - script:
            timeout: 30s
            content: bash ../invoice/expect-stripe.sh

    - name: publish a usage Offer with per-service discounts
      try:
        - apply:
            file: meter.yaml
        - apply:
            file: servicepricing.yaml
        - apply:
            file: offer.yaml
        - script:
            timeout: 30s
            content: bash ../offer/publish.sh e2e-inv-sd-offer
        - assert:
            timeout: 60s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: Offer
              metadata:
                name: e2e-inv-sd-offer
              status:
                (conditions[?type == 'OpenMeterPlanSynced']):
                  - status: "True"

    - name: create a BillingAccount with a Stripe payment method and bind the project
      try:
        - script:
            content: bash ../invoice/stripe-customer.sh customerId
            outputs:
              - name: stripeCustomerId
                value: ($stdout)
        - script:
            content: bash ../invoice/stripe-customer.sh paymentMethodId
            outputs:
              - name: stripePaymentMethodId
                value: ($stdout)
        - apply:
            file: paymentmethod.yaml
        - patch:
            file: paymentmethod-active.yaml
            subresource: status
        - patch:
            file: stripepaymentmethod-active.yaml
            subresource: status
        - apply:
            file: billingaccount.yaml
        - patch:
            file: billingaccount-payment-method-ready.yaml
            subresource: status
        - apply:
            file: billingaccountbinding.yaml
        - patch:
            file: billingaccountbinding-active.yaml
            subresource: status
        - assert:
            timeout: 60s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              metadata:
                name: e2e-inv-sd-account
                (finalizers[?@ == 'openmeter.miloapis.com/customer-link']): ['openmeter.miloapis.com/customer-link']

    - name: entitle the account to the Offer
      try:
        - apply:
            file: entitlement.yaml
        - assert:
            timeout: 120s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingEntitlement
              metadata:
                name: e2e-inv-sd-entitlement
              status:
                (conditions[?type == 'OpenMeterSubscriptionSynced']):
                  - status: "True"

    - name: publish usage and wait until OpenMeter has all of it
      try:
        - script:
            timeout: 60s
            content: bash ../invoice/publish-usage.sh
        - script:
            timeout: 600s
            content: bash ../invoice/wait-usage.sh

    - name: invoice the usage and issue it through Stripe
      cleanup:
        - script:
            timeout: 30s
            content: bash ../invoice/release-account.sh
      try:
        - script:
            timeout: 60s
            content: bash ../invoice/invoice-usage.sh
        - script:
            timeout: 330s
            content: bash ../invoice/issue-invoice.sh

    - name: the issued invoice appears as an Open Milo Invoice
      try:
        - script:
            timeout: 150s
            content: bash ../invoice/expect-milo-invoice.sh Open

    - name: paying in Stripe marks the Milo Invoice Paid
      try:
        - script:
            timeout: 120s
            content: bash ../invoice/pay-invoice.sh
        - script:
            timeout: 150s
            content: bash ../invoice/expect-milo-invoice.sh Paid

    - name: the paid account can be deleted
      try:
        - delete:
            ref:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingEntitlement
              name: e2e-inv-sd-entitlement
        - script:
            timeout: 10s
            content: kubectl delete billingaccount e2e-inv-sd-account -n "$NAMESPACE" --wait=false
        - error:
            timeout: 180s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              metadata:
                name: e2e-inv-sd-account
