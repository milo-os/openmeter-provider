apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: invoice
spec:
  description: |
    Follows one invoice from usage to payment, across every piece the
    migration wires together:

      usage on NATS -> submission consumer (attributed to the account)
        -> OpenMeter usage -> invoice for the subscribed plan
        -> Stripe invoice -> Milo Invoice (Open)
        -> paid in Stripe -> OpenMeter paid -> Milo Invoice (Paid)

    then deletes the account, which only succeeds once nothing it owes is
    left open.

    The Offer prices three meters (compute, storage, egress), so the
    invoice has one line per meter, each titled with its ServicePricing's
    displayName; every line is checked in OpenMeter and on the Stripe
    invoice. The lines and amounts are in the LINES table in lib.sh.

    Things that do not happen on their own in a local cluster are done by
    the suite, each explained in its script:
      - billing's operator, webhooks and stripe-provider do not run:
        the Offer is published with ../offer/publish.sh and the payment
        method chain is fabricated with status patches (as in the
        billingentitlement suite);
      - the invoice is cut now instead of at the end of the monthly period
        (invoice-usage.sh) and skips OpenMeter's one-hour collection wait
        (issue-invoice.sh);
      - Stripe would charge the invoice an hour after finalizing it and
        cannot reach OpenMeter's webhook here, so the suite pays it and
        relays Stripe's invoice.paid event (pay-invoice.sh).

    Needs the Stripe app as the default billing profile (task
    dev:install-stripe-app) and STRIPE_TEST_API_KEY for the same Stripe
    account.
  namespace: openmeter-system
  steps:
    - name: purge stale usage events for the suite's project
      description: |
        A previous run that failed after publishing could leave events on
        the stream; they would be billed into this run's invoice.
      try:
        - script:
            timeout: 45s
            content: |
              set -eu
              NATS_POD=$(kubectl get pod -n nats-system -l app.kubernetes.io/component=nats-box --no-headers -o name | head -1)
              if [ -z "$NATS_POD" ]; then
                echo "WARNING: no nats-box pod found, skipping purge"
                exit 0
              fi
              kubectl exec -n nats-system "$NATS_POD" -- \
                nats --server nats://nats:4222 \
                stream purge billing-usage \
                --subject "billing.usage.e2e-invoice.>" -f || true

    - name: start the OpenMeter query pod and check Stripe is set up
      try:
        - apply:
            file: query-pod.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: openmeter-query-inv
              status:
                phase: Running
        - script:
            timeout: 30s
            content: bash expect-stripe.sh

    - name: publish a usage Offer
      try:
        - apply:
            file: meter.yaml
        - apply:
            file: servicepricing.yaml
        - apply:
            file: offer.yaml
        - script:
            timeout: 30s
            content: bash ../offer/publish.sh e2e-inv-offer
        - assert:
            timeout: 60s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: Offer
              metadata:
                name: e2e-inv-offer
              status:
                (conditions[?type == 'OpenMeterPlanSynced']):
                  - status: "True"

    - name: create a BillingAccount with a Stripe payment method and bind the project
      try:
        - script:
            content: bash stripe-customer.sh customerId
            outputs:
              - name: stripeCustomerId
                value: ($stdout)
        - script:
            content: bash stripe-customer.sh paymentMethodId
            outputs:
              - name: stripePaymentMethodId
                value: ($stdout)
        - apply:
            file: paymentmethod.yaml
        - patch:
            file: paymentmethod-active.yaml
            subresource: status
        - patch:
            file: stripepaymentmethod-active.yaml
            subresource: status
        - apply:
            file: billingaccount.yaml
        - patch:
            file: billingaccount-payment-method-ready.yaml
            subresource: status
        - apply:
            file: billingaccountbinding.yaml
        - patch:
            file: billingaccountbinding-active.yaml
            subresource: status
        - assert:
            timeout: 60s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              metadata:
                name: e2e-inv-account
                (finalizers[?@ == 'openmeter.miloapis.com/customer-link']): ['openmeter.miloapis.com/customer-link']

    - name: entitle the account to the Offer
      description: |
        The subscription is what makes usage billable: OpenMeter only
        invoices usage that falls on a subscribed plan's rate card.
      try:
        - apply:
            file: entitlement.yaml
        - assert:
            # The entitlement retries a refused subscription every 30s,
            # e.g. while the customer's Stripe data is still being synced.
            timeout: 120s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingEntitlement
              metadata:
                name: e2e-inv-entitlement
              status:
                (conditions[?type == 'OpenMeterSubscriptionSynced']):
                  - status: "True"

    - name: publish usage and wait until OpenMeter has all of it
      description: |
        Usage on each of the three meters (the LINES table in lib.sh):
        25 vCPU hours, 50 GB-months of storage and 10 GB of egress,
        published the way billing's attribution stage emits them: subject
        projects/e2e-invoice (the bound project) on
        billing.usage.e2e-invoice.valid, with the billingaccountref
        extension naming the account the project is bound to. The
        submission consumer rewrites the subject to the account UID; the
        project stays in data.dimensions.project_name, where billing puts
        it.
      try:
        - script:
            timeout: 60s
            content: bash publish-usage.sh
        - script:
            # Above wait-usage.sh's own retry budget (120 x ~4s per meter;
            # the meters are usually ingested together, so later ones pass
            # at once).
            timeout: 600s
            content: bash wait-usage.sh

    - name: invoice the usage and issue it through Stripe
      description: |
        If the suite fails from here on, the account's finalizer may wait
        forever on an invoice that is still open, so the cleanup releases it
        with the force-delete annotation (release-account.sh), the ops
        escape hatch, which also unlinks the shared Stripe test customer.
        On a passing run the account is already gone by then.
      cleanup:
        - script:
            timeout: 30s
            content: bash release-account.sh
      try:
        - script:
            timeout: 60s
            content: bash invoice-usage.sh
        - script:
            # Above issue-invoice.sh's own retry budget (60 x ~5s).
            timeout: 330s
            content: bash issue-invoice.sh

    - name: the issued invoice appears as an Open Milo Invoice
      try:
        - script:
            timeout: 150s
            content: bash expect-milo-invoice.sh Open

    - name: paying in Stripe marks the Milo Invoice Paid
      try:
        - script:
            timeout: 120s
            content: bash pay-invoice.sh
        - script:
            timeout: 150s
            content: bash expect-milo-invoice.sh Paid

    - name: the paid account can be deleted
      description: |
        Deleting the entitlement cancels the subscription; deleting the
        account then deletes the OpenMeter customer. OpenMeter refuses that
        while any invoice is still open, so the account only disappears
        because the invoice was paid (the $0 invoice left by ending the
        period early is deleted by the account's finalizer).
      try:
        - delete:
            ref:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingEntitlement
              name: e2e-inv-entitlement
        - script:
            timeout: 10s
            content: kubectl delete billingaccount e2e-inv-account -n "$NAMESPACE" --wait=false
        - error:
            timeout: 180s
            resource:
              apiVersion: billing.miloapis.com/v1alpha1
              kind: BillingAccount
              metadata:
                name: e2e-inv-account
