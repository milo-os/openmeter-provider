# Five meters, one per thing the customer pays for, so the invoice has one
# line each.
apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: inv-vcpu-hours
spec:
  meterName: inv-vcpu-hours
  phase: Published
  displayName: "vCPU hours"
  measurement:
    aggregation: Sum
    unit: "{vCPU-hour}"
  billing:
    consumedUnit: "{vCPU-hour}"
    pricingUnit: "{vCPU-hour}"
  monitoredResourceTypes:
    - e2e.miloapis.com/Resource
---
apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: inv-storage-gb-months
spec:
  meterName: inv-storage-gb-months
  phase: Published
  displayName: "Block storage GB-months"
  measurement:
    aggregation: Sum
    unit: "{GB-month}"
  billing:
    consumedUnit: "{GB-month}"
    pricingUnit: "{GB-month}"
  monitoredResourceTypes:
    - e2e.miloapis.com/Resource
---
apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: inv-egress-gb
spec:
  meterName: inv-egress-gb
  phase: Published
  displayName: "Network egress GB"
  measurement:
    aggregation: Sum
    unit: GBy
  billing:
    consumedUnit: GBy
    pricingUnit: GBy
  monitoredResourceTypes:
    - e2e.miloapis.com/Resource
---
# Measured in a smaller unit than it is priced in: byte-seconds, priced per
# GiB-second (servicepricing.yaml inv-memory converts it).
apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: inv-memory-byte-seconds
spec:
  meterName: inv-memory-byte-seconds
  phase: Published
  displayName: "Memory byte-seconds"
  measurement:
    aggregation: Sum
    unit: By.s
  billing:
    consumedUnit: By.s
    pricingUnit: By.s
  monitoredResourceTypes:
    - e2e.miloapis.com/Resource
---
# Measured in bytes, priced per GiB in graduated tiers
# (servicepricing.yaml inv-egress-tiered converts it).
apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: inv-egress-bytes
spec:
  meterName: inv-egress-bytes
  phase: Published
  displayName: "Network egress bytes"
  measurement:
    aggregation: Sum
    unit: By
  billing:
    consumedUnit: By
    pricingUnit: By
  monitoredResourceTypes:
    - e2e.miloapis.com/Resource
