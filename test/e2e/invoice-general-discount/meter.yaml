# Five meters, one per thing the customer pays for, so the invoice has one
# line each.
apiVersion: billing.miloapis.com/v1alpha1
kind: MeterDefinition
metadata:
  name: inv-gd-vcpu-hours
spec:
  meterName: inv-gd-vcpu-hours
  phase: Published
  displayName: "vCPU hours"
  measurement:
    aggregation: Sum
    unit: "{vCPU-hour}"
  billing:
    consumedUnit: "{vCPU-hour}"
    pricingUnit: "{vCPU-hour}"
  monitoredResourceTypes:
    - e2e.miloapis.com/Resource
---
