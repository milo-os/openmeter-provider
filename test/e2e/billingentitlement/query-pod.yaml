# Long-lived helper pod used to reach the openmeter-api ClusterIP service
# from inside the cluster network via `kubectl exec`. Named per suite so a
# previous suite's pod still terminating never collides with this one.
apiVersion: v1
kind: Pod
metadata:
  name: openmeter-query-be
spec:
  restartPolicy: Never
  containers:
    - name: query
      image: busybox:1.36
      command: ["sleep", "3600"]
