# Reaches openmeter-api from inside the cluster via `kubectl exec`; the app
# pods are distroless. Its own name, so it never collides with another
# suite's query pod that is still terminating.
apiVersion: v1
kind: Pod
metadata:
  name: openmeter-query-it
  namespace: openmeter-system
spec:
  restartPolicy: Never
  containers:
    - name: query
      image: busybox:1.36
      command: ["sleep", "3600"]
